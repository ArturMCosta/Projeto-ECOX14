# Onde o grafo do dbt comeca.
#
# Estas tabelas nao sao feitas pelo dbt: sao os Parquet que o carga.py
# colocou no banco. Declarar a origem hoje nao muda o resultado, mas e o
# que permite, na proxima aula, testar o dado de entrada antes de
# transformar.
version: 2

sources:
  - name: prata
    schema: prata
    tables:
      - name: paises
      - name: expectativa_vida
      - name: gasto_saude
      - name: determinantes_socioeconomicos
      - name: indicadores_enriquecidos
